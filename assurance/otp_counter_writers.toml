#
# Every production site that persists a Yubico-OTP slot record, and therefore
# writes the two tail bytes that hold the use counter. Held to the tree by
# `scripts/counter_writers_gate.py`; nothing about which sites EXIST is stored
# here — the roster is derived and only the judgement is written down.
#
# This file exists because both halves of the counter's own documentation stated
# a roster from memory and both were wrong. `counter.rs` said "both writers …
# take their step from here" and `counter_kani.rs` said four sites "are every
# writer of the first two tail bytes". There are eight, and two of them take
# their step from `counter.rs`.
#
# A site is keyed by `(file, fn, ordinal)` — the Nth persist call inside that
# function — and carries neither a line number nor the text of its call. Both
# were tried and both were wrong in the same direction: the question here is how
# many writers there are, and that answer must not move because an edit above
# pushed every site down twelve lines, nor because a local was renamed from
# `rec` to `record` at one call site. Measured, that rename reported both "does
# not list it" and "which persists nothing" at EXIT=1. Line freshness for the
# tree's citations belongs to `citation_gate.py`.

[scope]
# Checked against the derivation, so the sentence in `counter_kani.rs` cannot
# outrun the tree the way the one it replaces did.
writers = 8
forwarders = 1
stepped = 2

[[site]]
file = "crates/rsk-otp/src/lib.rs"
ordinal = 0
verb = "seal_put"
fn = "put_slot"
kind = "forwarder"
proved = "no"
why = """
The shared seal-and-store helper the five `self.put_slot(…)` sites reach. It
decides no byte of the record it is handed, so it is on the roster to be
accounted for rather than to be proved.
"""

[[site]]
file = "crates/rsk-otp/src/lib.rs"
ordinal = 0
verb = "put_slot"
fn = "button_ticket"
kind = "writer"
proved = "partial"
via = "build"
why = """
The per-press writer. Partial, and the word is load-bearing: only the Yubico-OTP
branch of `ticket::build` takes its step from `next_use_counter`. Two paths sit
outside the proof's scope, and NEITHER is a live gap in the replay defence. The
OATH-HOTP branch writes the high half of a 64-bit moving factor into the same
two bytes, but a slot is in one mode or the other — `TKTFLAG_UPDATE_MASK` (0x3F)
cannot flip `TKT_OATH_HOTP` (0x40), `cmd_configure` zeroes the tail on every
(re)configure, and `power_up_bump` skips HOTP slots — and those two bytes would
need 2^48 presses to move. The Yubico branch's 0 -> 1 promotion happens before
the call, and it moves the counter FORWARD, which is the Yubico convention.
Recorded because `counter_kani.rs` proves neither, not because either is wrong.
"""

[[site]]
file = "crates/rsk-otp/src/lib.rs"
ordinal = 0
verb = "put_slot"
fn = "cmd_configure"
kind = "writer"
proved = "no"
why = """
A fresh slot: a whole zeroed record, so the counter starts at 0. This is the
base case of the induction `counter_kani.rs` discharges the step of, which is
why the proof may assume `stored <= USE_COUNTER_MAX` rather than establish it.
"""

[[site]]
file = "crates/rsk-otp/src/lib.rs"
ordinal = 0
verb = "put_slot"
fn = "cmd_update"
kind = "writer"
proved = "no"
why = """
Carries the stored tail forward rather than deciding it — a truncating `merged`
here once rolled the counter back (audit run-30). Verbatim only when the stored
record carries a tail; a legacy 52-byte one reads back as zeros, which is the
value that record already implied.
"""

[[site]]
file = "crates/rsk-otp/src/lib.rs"
ordinal = 0
verb = "put_slot"
fn = "cmd_swap"
kind = "writer"
proved = "no"
why = """
A swap relocates the other slot's counter verbatim. Neither of the two claims
this ledger replaces mentioned `cmd_swap` at all, and it writes the two bytes
twice per command.
"""

[[site]]
file = "crates/rsk-otp/src/lib.rs"
ordinal = 1
verb = "put_slot"
fn = "cmd_swap"
kind = "writer"
proved = "no"
why = """
The other half of the same swap. Listed apart because it is a second write to a
second fid: folding the two into one entry is how "seven or eight" became an
answer nobody could pin.
"""

[[site]]
file = "crates/rsk-otp/src/lib.rs"
ordinal = 0
verb = "seal_put"
fn = "migrate_seal"
kind = "writer"
proved = "no"
why = """
Re-seals a slot found under the pre-OTP kbase arm. The bytes are carried across
verbatim, so the counter's value is unchanged, but the record is rewritten and a
torn write here lands on the same two bytes as any other.
"""

[[site]]
file = "crates/rsk-otp/src/lib.rs"
ordinal = 1
verb = "seal_put"
fn = "migrate_seal"
kind = "writer"
proved = "no"
why = """
Seals a legacy plaintext config in place, again verbatim. Runs at every boot,
before `power_up_bump` — so the boot path writes these bytes twice, which is not
what a roster of four writers suggests.
"""

[[site]]
file = "crates/rsk-otp/src/lib.rs"
ordinal = 0
verb = "seal_put"
fn = "power_up_bump"
kind = "writer"
proved = "yes"
why = """
The boot-time bump, and the only site whose two bytes are decided entirely by
`counter.rs` — `boot_use_counter` and nothing else.
"""
