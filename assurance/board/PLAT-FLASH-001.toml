# The store's crash-consistency envelope rests on this and on nothing else: a
# torn program leaves the old record or a detectably bad one, never a plausible
# wrong one. It is the row that blocks stage 5's exit.
#
# The first version of this record claimed the script sweeps offsets. It does
# not: tests/29_reset_power_cut.py takes ONE delay (`RSK_POWER_CUT_DELAY_MS`,
# default `2 * KEEPALIVE_MS`) and performs ONE cut per run, and its assertions
# are about the post-cut getInfo, the old credential refusing without a gate,
# the backup state and the owner seed -- it never reads a store record back and
# classifies it.
# So the sweep is part of the METHOD a person has to perform, not something the
# script does, and the classification is a second instrument this row still owes.
assumption = "PLAT-FLASH-001"
method = """`python tests/29_reset_power_cut.py` against a throwaway board with a REAL supply cut -- not `picotool reboot` and not a watchdog reset, neither of which stops the flash array mid-program. One run is one cut at one delay, so the sweep is the operator's: repeat over `RSK_POWER_CUT_DELAY_MS` across the program window, and record every delay tried, including the ones that landed outside it. `RSK_POWER_CUT_LOG` is where they land: one JSON object per cut, appended, so the list is what a rerun cannot overwrite. Aim it at a file in the tree and paste it into `actual`; unset, it defaults outside the checkout."""
boot_config = """The DEFAULT image with its partition table applied, on a 4 MB board. The 16 MB geometry is a separate cell of docs/assurance-matrix.md and a 4 MB run does not cover it."""
expected = """Every interrupted write leaves the record readable as the OLD value or refused as corrupt. PASS = old-or-refused at every delay tried, with the delays listed. FAIL = one record that reads back as a well-formed value nobody wrote, which falsifies the store model outright. INCONCLUSIVE = no delay landed inside the program window, which the script cannot tell you on its own -- it asserts about the device after the cut, not about the record's bytes, so classifying the record is a second instrument this row still owes."""
outcome = "planned"
board = ""
stepping = ""
firmware_sha256 = ""
first_boot_capture = ""
actual = ""
note = """A RUN HAPPENED on 2026-09-04 and it does NOT discharge this row; both halves of that are worth the record. WHAT IT ESTABLISHES: `tests/29_reset_power_cut.py` was driven against the board with a real supply cut and printed PASS -- the transcript is assurance/board/PLAT-FLASH-001-2026-09-04-powercut.log beside this file. The cut landed inside the wipe, and the tell is the shape of the failure rather than a timeout: the RESET sender came back `OSError('read error')`, a USB handle that died under it. Across the reboot the device was fail-closed on every axis the script reads -- `clientPin=True alwaysUv=True sealed=True` -- and the pre-cut resident credential answered `0x36`. So `expected`'s FAIL, a record reading back as a well-formed value nobody wrote, did not occur. WHY IT IS NOT A DISCHARGE, in this record's own words: `method` puts the sweep on the operator -- repeat over `RSK_POWER_CUT_DELAY_MS` across the program window and record every delay tried -- and a hand sets no delay at all, because that variable is read only in the `RSK_POWER_CUT_CMD` branch. A manual cut is one sample at an unknown latency, `expected` asks for the delays LISTED, and nothing in the script timestamped the tear when it ran, so that transcript cannot list one. `expected` names the other gap itself: the script asserts about the DEVICE after the cut, not about the record's bytes, so telling old-or-refused from a plausible value nobody wrote is a second instrument this row still owes and this tree does not have. Two instruments, then, before a relay is even the binding constraint. MEASURED BESIDE IT, because a first attempt returned INCONCLUSIVE and the reason was not the operator: the manual arm prints `>>> CUT POWER NOW <<<` AFTER starting the RESET thread, so the window a hand must hit is the whole duration of `authenticatorReset` on the wire. That is 487.2 ms on this board (assurance/board/PLAT-FLASH-001-2026-09-04-window.log) -- reachable, and the printed line is what a hand should still take its cue from: the line reaches the operator at most 0.11 ms after the window opens (the widest value over every run measured against a simulated board across three sessions, not the seven of them that were under 0.1 ms -- two of the first twelve were not; a ceiling rather than an interval, because the low end carries nothing and a later session read 0.006 ms), so a 200-300 ms human reaction to it lands inside the 487.2 ms and above the 100 ms floor the instrument below needs, where a yank riding the Enter itself lands at ~0 ms and below it. The relay's default delay was 25 ms and is 2 * KEEPALIVE_MS now, because at 25 ms nothing can confirm the cut landed in the wipe at all; the old number was mistaken for the window once already in this session, by inference rather than measurement. AMENDED AFTER THE FACT, and the amendment is not the timestamps: the script now asks the DEVICE whether the reset had started. `rsk_usb::ctaphid::run_with_keepalive` is entered only after the whole CBOR request is reassembled and writes its first `CTAPHID_KEEPALIVE` one `KEEPALIVE_MS` (100) later, so one frame carrying `STATUS_PROCESSING` says the request reached the board AND the handler had been running that long -- and `STATUS_UPNEEDED` says the opposite, a ceremony still ahead of every flash write. Without a PROCESSING frame the run now exits INCONCLUSIVE. THAT IS THE HOLE THE 2026-09-04 RUN SAT IN: `main` asserted only that the post-cut device was fail-closed, and a device on which the reset never began is trivially fail-closed, so a cut landing before the request reached the board passed every assertion and printed PASS. What a keepalive does NOT establish is that any erase landed -- nothing on the wire separates the ceremony's return from `wipe`'s first tombstone -- and it exists only because this operation is slower than 100 ms, which is what the 487.2 ms above says. Each cut also appends one JSON object (outside the tree by default; `RSK_POWER_CUT_LOG` aims it somewhere to be committed) carrying two upper bounds on the cut, one lower bound, and the instant the device was first seen inside the reset, each under the bound it is. The 2026-09-04 cut predates all of it and its delay is still not MEASURED, though `cannot list one` above is about its transcript rather than about the interval: that run reached `reset interrupted as intended` rather than the `RESET completed` branch, so it is bounded to (0, 487.2 ms) by the two logs cited above -- a listable interval, and a useless one. Neither of the two instruments `expected` asks for is delivered by this: it adds the third one both of them presuppose. AMENDED AGAIN AFTER REVIEW, and two of the three are about what the third instrument could NOT tell you. (1) The keepalive had to be OURS: the tap read the status byte off any KEEPALIVE frame without comparing the channel id it arrived on, and every open handle on a HID device sees every input report -- driven, a board that never saw the RESET, with PROCESSING frames arriving on channel aabbccdd, printed PASS at exit 0. It is scoped to the channel now, and frames on another one are counted and refused. (2) The confirmable band opens at 100 ms while `reset()` starts at 0, so the first `KEEPALIVE_MS` of the handler -- where `request_rescrub` and the first tombstones land -- is un-PASSable BY CONSTRUCTION: a cut there returns INCONCLUSIVE whether or not it tore anything. On a simulated board over a 1 ms grid the flip is at the floor exactly -- last unconfirmed 100 ms, first torn 101 ms -- and a real board adds USB and host latency nothing here measures, so the false-red band starts at 100 ms and ends somewhere above it this cannot name; the 200 ms default is 100 ms clear of the floor. That is the safe direction and it is still a hole in the sweep this row asks for: the earliest part of the program window cannot be reported on at all. (3) The falsification is in the tree rather than in a scratchpad -- scripts/test_reset_power_cut.py, 58 checks over 26 scenarios and 25 mutants that each name the checks which must go red for them, running in check.sh's `pytest (gate scripts)` row, because this script is board-only and no row runs it: the guard above could otherwise have been deleted with the gate green."""
