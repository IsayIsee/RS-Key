actual = """PASS on the clause as written, and on BOTH halves it names. `python tests/54_sram_residue.py control` was driven against the ELF that is in flash and exited `settled` (3): the whole 532480-byte dump came back zero at one distinct value -- not the `.data` window alone, which is the partial clear the script refuses to conclude from -- and the 256-byte pattern written to 0x2001_0000 through picoboot read straight back, which is the half that separates "the memory is zero" from "picoboot only answers zeros". The dump is this image's memory and not another's: 4096 bytes of `.text` read back byte-exact against the ELF, the control that catches the wrong-image mix-up. WHAT THIS DOES NOT ESTABLISH, and the record must not be read as: that `worker::reboot`'s scrub works. The platform cleared the memory, not our code -- the script's own `settled` text says exactly that -- and in a dump that is zero everywhere the two are indistinguishable. The transcript's `0/18 immutable .data symbols byte-exact` line is that same fact from the other side: on a board that kept SRAM those symbols would come back byte-exact, and here nothing did, because there is nothing left to come back. This row is a PLATFORM assumption and that is all it is."""
arm_taken = """PASS. Main SRAM does not survive the drop. PASS = every byte of the dump is zero AND the written pattern reads straight back, which is the script's `settled` (exit 3) -- both halves, because zeros alone have two causes and the writeback separates them. FAIL = the pattern, or any non-zero live region, which puts an unwrapped seed inside reach of anyone who can hold BOOTSEL. INCONCLUSIVE = zeros with a writeback that does NOT read back (exit 2), or a short dump: picoboot is not serving SRAM and nothing found or not found in it would mean anything."""
note = """DECIDED BY THE MAINTAINER, 2026-09-04: option A, the row is discharged by `control` alone. The old note left two arms open and this takes the first. The reason is not that the second is expensive but that it is unsatisfiable by construction on a well-behaved board -- `residue` shares `check_readable` with `control` and `settled` raises out of it before the scan, so the better the platform behaves the more certainly `residue` refuses to answer, and a route a passing world can never satisfy is not a route. The `residue` arm is kept, in `method` above, reframed as a demand on a boot configuration where SRAM SURVIVES the drop and not on a re-run of this board. WHAT THE NARROWED CRITERION STILL REFUSES, because "any green passes" is what this must not become, and each of these is a clause of the `expected` above rather than a new rule: a mismatching `.text` window is a FAIL, and it is the wrong-image mix-up the control exists for; zeros with a write-back that does NOT read back are INCONCLUSIVE, the "picoboot only answers zeros" case; a short dump is INCONCLUSIVE, because regions the verdict covers went unread; and a `.data` window zero over a dump that is NOT zero is INCONCLUSIVE, the partial clear that would leave the stack and the 128 KiB keygen heap intact. The PASS needs both halves and zeros alone are not one of them. THE IMAGE is pinned two ways in assurance/board/image-2026-09-03.txt: `firmware_sha256` here is the UF2 that was dragged to the board, and that file also carries the ELF sha256 d551ff6ec9a71febe087a6ca1485c319be3e206caafc92d06ff2a9428a3fb1b9 -- the ELF the region map and the `.text` window were taken from, which is what this row's control actually compares against -- plus the chipid and the bcdDevice the device reported. picotool v2.2.0-a4. WHY `first_boot_capture` IS THE RUN LOG HERE, where PLAT-ROM-002's is deliberately not: that row's `expected` asks whether the bootloader ARRIVED, which a host can observe from outside the script, so its capture is the independent enumeration reading. This row's `expected` asks what is IN memory, and picoboot driven by this script is the only instrument that reads that -- there is no second reading to prefer, and naming assurance/board/image-2026-09-03.txt instead would name a file that identifies the image and answers none of the expectation. What plays the independent role is split in two and both halves sit elsewhere: that the board really was in the bootloader is PLAT-ROM-002's own discharged result, which this row `depends_on`, and that the ELF really is the flashed image is the `.text` window plus that capture file. READ THIS ROW'S VERDICT OFF THE TRANSCRIPT, NEVER OFF THE EXIT CODE. The world `expected` calls FAIL -- "the pattern, or any non-zero live region" -- is a world `tests/54_sram_residue.py control` calls PASS. `check_readable` takes its non-zero path, finds the RAM-resident `.data` symbols intact, prints `SRAM READABLE`, and `cmd_control` then prints `PASS` and returns. Driven on a synthetic dump -- `.data` byte-exact against the ELF and 131072 non-zero bytes across the main-stack window, which is where the unwrapped seed would sit -- the run prints the same PASS line `control` ends on and exits 0. The non-zero exits `control` has are a `.text` mismatch (1), the INCONCLUSIVE branches (2) -- among them a non-zero dump with NOTHING intact -- and the `settled` (3) this row was discharged on; none of them is a live region that reads back, because that verdict was always the `residue` arm's to reach and `method` above no longer runs it. A SMALLER SIBLING of the same shape: the short-dump INCONCLUSIVE sits INSIDE the all-zero branch, so a truncated dump that still covers a NON-ZERO `.data` never reaches it -- driven at 4096 of 532480 bytes, the same PASS and the same exit 0, with the main-stack window read as 0 B. NONE OF THIS TOUCHES THE RECORDED RESULT: the 2026-09-03 dump really was 532480 bytes at one distinct value, which is the branch that ends in `settled`. It is owed to the NEXT run: the registry row's `revalidated_by` demands one when the stepping or the boot configuration moves, and a configuration that KEEPS SRAM is exactly the one this instrument answers PASS/0 over -- so read the transcript's dump line and its region table, not the shell's `$?`. Repairing the script is a separate change and is deliberately not folded into this record."""
