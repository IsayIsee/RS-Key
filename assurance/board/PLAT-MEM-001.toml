assumption = "PLAT-MEM-001"
method = """`python tests/54_sram_residue.py control`: dump main SRAM through picoboot after a drop to BOOTSEL, check the RAM-resident code and table windows the ELF pins, and -- on an all-zero dump -- write a 256-byte pattern at 0x2001_0000 through picoboot and read it straight back. THAT IS THE WHOLE ROUTE FOR THIS ROW: both halves `expected` calls PASS are read off `control`, and the maintainer's ruling is that `control` alone discharges it. `residue` -- generate an RSA-2048 key on-card, then hunt a factor of its modulus per ELF region -- is RETAINED, but as a demand on a DIFFERENT boot configuration, one where SRAM survives the drop, and NOT as a re-run of this board: it has no reader of its own, calls the same `check_readable` `control` calls, and on an all-zero dump with a returning write-back `settled` raises out of that function ahead of the region scan, ahead of the verdict and ahead of `--expect`. On a board that behaves as this one does `residue` cannot answer at all; on one that keeps SRAM it is the two-run measurement of the scrub, and that is the configuration this arm is owed on."""
